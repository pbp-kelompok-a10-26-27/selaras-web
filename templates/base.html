{% load lucide static component_tags %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <link rel="icon" type="image/svg+xml" href="{% static 'assets/images/logo.svg' %}" />

    <title>{% block title %}SELARAS{% endblock %}</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.cdnfonts.com/css/transcity" rel="stylesheet" />

    <link rel="stylesheet" href="{% static 'css/output.css' %}" />
    <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  </head>

  <body class="min-h-screen">
    {% component "navbar" authenticated=user.is_authenticated / %}
    {% block content %} 
    {% endblock %}
    {% component "footer" / %}
  </body>
</html>

<script type="module" src="{% static 'js/main.js' %}" defer></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
{% block scripts %}
{% endblock %}
