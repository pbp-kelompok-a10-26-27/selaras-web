{% load lucide static component_tags %}

<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <link rel="icon" type="image/svg+xml" href="{% static 'assets/images/logo.svg' %}" />

    <title>{% block title %}SELARAS{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.cdnfonts.com/css/transcity" rel="stylesheet" />

    <link rel="stylesheet" href="{% static 'css/output.css' %}" />
    {% block extra_head %}{% endblock %}
  </head>

  <body class="min-h-screen">
    {% component "navbar" authenticated=user.is_authenticated / %}
    {% block content %} 
    {% endblock %}
    {% component "footer" / %}

    <script type="module" src="{% static 'js/main.js' %}" defer></script>
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js" integrity="sha384-hJnF5AwidE18GSWTAGHv3ByzzvfNZ1Tcx5y1UUV3WkauuMCEzBJBMSwSt/PUPXnM" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
