{% load static lucide %}
<!doctype html>
<html lang="id" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>{% block title %}SELARAS{% endblock %}</title>

    <link rel="icon" type="image/svg+xml" href="{% static 'assets/images/logo.svg' %}" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.cdnfonts.com/css/transcity" rel="stylesheet" />

    <link rel="stylesheet" href="{% static 'css/output.css' %}" />
  </head>

  <body
    class="error-page relative isolate flex min-h-[100svh] flex-col overflow-x-clip bg-primary-50 font-sans text-foreground selection:bg-primary-300 selection:text-secondary-900"
    data-error-page
  >
    {# Background: soft blobs, a light that follows the pointer, falling leaves (errors.js) #}
    <div aria-hidden="true" class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
      <div class="absolute -top-32 -left-24 h-96 w-96 rounded-full bg-primary-200 opacity-70 blur-3xl"></div>
      <div class="absolute top-1/3 -right-32 h-[28rem] w-[28rem] rounded-full bg-tertiary-200 opacity-60 blur-3xl"></div>
      <div class="absolute -bottom-40 left-1/4 h-96 w-96 rounded-full bg-secondary-100 opacity-80 blur-3xl"></div>
      <div class="error-glow absolute inset-0 hidden pointer-fine:block"></div>
      <div id="falling-leaves" class="absolute inset-0"></div>
    </div>

    <header class="mx-auto flex w-full max-w-7xl items-center justify-between px-4 pt-6 sm:px-8 lg:px-12">
      <a
        href="{% url 'home' %}"
        class="group flex items-center gap-2.5 rounded-xl outline-none focus-visible:ring-2 focus-visible:ring-primary-500 focus-visible:ring-offset-4 focus-visible:ring-offset-primary-50"
      >
        <img
          src="{% static 'assets/images/logo.svg' %}"
          alt=""
          class="h-10 w-10 transition-transform duration-500 group-hover:rotate-12"
        />
        <span class="font-display text-h5 tracking-wide text-secondary-900">SELARAS</span>
      </a>
      <span class="hidden rounded-full border border-secondary-200 bg-neutral-50/70 px-3 py-1 text-b4 font-semibold tracking-widest text-secondary-600 uppercase backdrop-blur sm:inline-flex">
        {% block code_label %}{% endblock %}
      </span>
    </header>

    <main class="mx-auto flex w-full max-w-7xl flex-1 items-center px-4 py-10 sm:px-8 lg:px-12 lg:py-12">
      {% block content %}{% endblock %}
    </main>

    <footer class="mx-auto w-full max-w-7xl px-4 pb-6 text-b4 text-neutral-800 sm:px-8 lg:px-12">
      &copy; SELARAS. Hidup selaras dengan bumi, satu kebiasaan setiap hari.
    </footer>

    <script type="module" src="{% static 'js/errors/errors.js' %}"></script>
  </body>
</html>
