{% load lucide %}
{# Shared top row of every landing demo: badge, title and a reset button #}
<div class="flex items-center justify-between gap-3">
  <p class="landing-demo-chip"><span class="landing-demo-pulse" aria-hidden="true"></span>Demo</p>
  <button type="button" data-demo-reset class="inline-flex min-h-9 cursor-pointer items-center gap-1.5 rounded-lg px-2.5 font-sans text-xs font-semibold text-secondary-700 outline-none transition-colors hover:bg-secondary-50 hover:text-secondary-900 focus-visible:ring-2 focus-visible:ring-primary-500">
    {% lucide "rotate-ccw" class="w-3.5 h-3.5" %} Ulangi
  </button>
</div>
<h4 id="{{ title_id }}" class="mt-4 font-sans text-lg font-semibold text-secondary-900">{{ title }}</h4>
