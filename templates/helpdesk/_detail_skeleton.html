{% load component_tags %}
<!-- Loading placeholder for the ticket card + conversation (cloned by ticket_detail.js, also on retry) -->
<template id="tpl-detail-skeleton">
  <div class="flex flex-col gap-8" aria-hidden="true">
    <div class="flex flex-col gap-6 rounded-3xl border border-neutral-400 bg-neutral-50 p-5 sm:p-8">
      <div class="flex gap-2">
        {% component "skeleton" variant="rect" width="w-24" height="h-8" rounded="rounded-lg" / %}
        {% component "skeleton" variant="rect" width="w-28" height="h-7" rounded="rounded-full" / %}
        {% component "skeleton" variant="rect" width="w-20" height="h-7" rounded="rounded-full" / %}
      </div>
      {% component "skeleton" variant="rect" width="w-3/4" height="h-9" rounded="rounded-xl" / %}
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
        {% for i in "123" %}
        <div class="flex items-center gap-3">
          {% component "skeleton" variant="avatar" width="w-10" height="h-10" / %}
          {% component "skeleton" variant="text" lines=2 height="h-3" class_="flex-1" / %}
        </div>
        {% endfor %}
      </div>
      {% component "skeleton" variant="rect" height="h-28" rounded="rounded-2xl" / %}
    </div>
    <div class="flex flex-col gap-3">
      {% component "skeleton" variant="rect" width="w-56" height="h-7" rounded="rounded-xl" / %}
      {% for i in "12" %}
      {% component "skeleton" variant="rect" height="h-24" rounded="rounded-2xl" / %}
      {% endfor %}
    </div>
  </div>
</template>
