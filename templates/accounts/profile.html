{% extends "base.html" %} 
{% block title %}
    Profile | SELARAS
{% endblock %} 
{% block content %}
<main class="mx-auto max-w-xl px-4 py-12">
  <h1>Your profile</h1>
  <form method="post" novalidate>
    {% csrf_token %} {{ form.as_p }}
    <button type="submit">Save changes</button>
  </form>
  <p><a href="{% url 'accounts:password_change' %}">Change password</a></p>
</main>
{% endblock %}
