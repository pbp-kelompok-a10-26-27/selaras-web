{% load component_tags %}

<div class="relative inline-flex group" data-tooltip-wrapper>
  {# Target element trigger (default slot) #}
  <div aria-describedby="{{ id }}" class="inline-flex">
    {% slot "trigger" default %}{% endslot %}
  </div>

  {# Tooltip Bubble #}
  <div
    id="{{ id }}"
    role="tooltip"
    class="absolute z-50 px-3 py-1.5 text-xs font-sans text-neutral-50 bg-neutral-900 rounded-xl shadow-xl pointer-events-none opacity-0 group-hover:opacity-100 group-focus-within:opacity-100 transition-all duration-200 ease-out whitespace-nowrap
      {% if position == 'bottom' %}
        top-full mt-2 left-1/2 -translate-x-1/2 translate-y-1 group-hover:translate-y-0 group-focus-within:translate-y-0
      {% elif position == 'left' %}
        right-full mr-2 top-1/2 -translate-y-1/2 translate-x-1 group-hover:translate-x-0 group-focus-within:translate-x-0
      {% elif position == 'right' %}
        left-full ml-2 top-1/2 -translate-y-1/2 -translate-x-1 group-hover:translate-x-0 group-focus-within:translate-x-0
      {% else %}
        bottom-full mb-2 left-1/2 -translate-x-1/2 -translate-y-1 group-hover:translate-y-0 group-focus-within:translate-y-0
      {% endif %}
      {{ class_ }}"
  >
    {% slot "content" %}{{ text }}{% endslot %}
  </div>
</div>
