{% load lucide %}

<div class="space-y-2 {{ class_ }}" data-file-drop data-max-mb="{{ max_mb }}" data-accept="{{ accept }}">
  <label
    for="{{ id }}"
    data-file-zone
    class="group relative flex cursor-pointer flex-col items-center gap-1.5 rounded-2xl border-2 border-dashed bg-neutral-100 px-5 py-7 text-center transition-all duration-200 hover:border-primary-500 hover:bg-primary-50 has-[:focus-visible]:ring-2 has-[:focus-visible]:ring-primary-500 has-[:focus-visible]:ring-offset-2 data-[dragging=true]:scale-[1.01] data-[dragging=true]:border-primary-500 data-[dragging=true]:bg-primary-100
      {% if errors %}border-tertiary-600{% else %}border-neutral-500{% endif %}"
  >
    <span class="mb-1 flex h-11 w-11 items-center justify-center rounded-full bg-primary-100 text-primary-700 transition-transform duration-200 group-hover:-translate-y-0.5" aria-hidden="true">
      {% lucide icon class="w-5 h-5" %}
    </span>
    <span class="font-sans text-s5 text-secondary-900">{{ title }}</span>
    {% if hint %}<span class="font-sans text-b4 text-neutral-800">{{ hint }}</span>{% endif %}
    <input type="file" id="{{ id }}" name="{{ name }}"
      {% if accept %}accept="{{ accept }}"{% endif %}
      {% if required %}required{% endif %}
      class="sr-only {{ input_class }}" />
  </label>

  <div data-file-preview hidden class="flex items-center gap-3 rounded-2xl border border-primary-300 bg-primary-50 p-3">
    <div data-file-thumb class="flex h-14 w-14 shrink-0 items-center justify-center overflow-hidden rounded-xl bg-primary-100 text-primary-700">
      <span data-file-icon aria-hidden="true">{% lucide "file-text" class="w-6 h-6" %}</span>
    </div>
    <div class="min-w-0 flex-1">
      <p data-file-name class="truncate font-sans text-s5 text-secondary-900"></p>
      <p data-file-size class="font-sans text-b4 text-neutral-800"></p>
    </div>
    <button
      type="button"
      data-file-clear
      aria-label="Hapus file yang dipilih"
      class="flex h-9 w-9 shrink-0 cursor-pointer items-center justify-center rounded-xl text-neutral-800 outline-none transition-colors hover:bg-neutral-200 hover:text-foreground focus-visible:ring-2 focus-visible:ring-primary-500"
    >
      {% lucide "x" class="w-4 h-4" %}
    </button>
  </div>

  <div data-file-error role="alert" class="space-y-0.5 px-1">
    {% for error in errors %}
    <p class="flex items-center gap-1.5 font-sans text-xs font-semibold text-tertiary-700">
      {% lucide "circle-alert" class="w-3.5 h-3.5 shrink-0" %}{{ error }}
    </p>
    {% endfor %}
  </div>
</div>
