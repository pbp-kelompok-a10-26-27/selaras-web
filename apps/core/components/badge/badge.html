{% load lucide %}

<span
  {% if attrs %}{{ attrs|safe }}{% endif %}
  class="inline-flex shrink-0 items-center gap-1.5 whitespace-nowrap rounded-full border font-sans font-semibold

    {% if variant == 'secondary' %}
      border-secondary-700 bg-secondary-700 text-neutral-50
    {% elif variant == 'tertiary' %}
      border-tertiary-300 bg-tertiary-100 text-tertiary-800
    {% elif variant == 'neutral' %}
      border-neutral-400 bg-neutral-200 text-neutral-900
    {% elif variant == 'info' %}
      border-blue-100/40 bg-blue-100/10 text-blue-200
    {% elif variant == 'warning' %}
      border-orange-100/60 bg-orange-100/15 text-secondary-900
    {% elif variant == 'danger' %}
      border-red-100/40 bg-red-100/10 text-red-100
    {% elif variant == 'outline' %}
      border-dashed border-neutral-500 bg-neutral-50 text-neutral-900
    {% else %}
      border-primary-300 bg-primary-100 text-secondary-800
    {% endif %}

    {% if size == 'sm' %}px-2.5 py-0.5 text-b4{% else %}px-3 py-1 text-b4{% endif %}

    {{ class_ }}"
  data-badge
  data-variant="{{ variant }}"
>
  {% if icon %}<span class="inline-flex shrink-0" aria-hidden="true">{% lucide icon class="w-3.5 h-3.5" %}</span>{% endif %}
  {% if text %}<span>{{ text }}</span>{% endif %}
</span>
