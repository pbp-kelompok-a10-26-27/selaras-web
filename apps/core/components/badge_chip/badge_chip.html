{% load lucide %}
{% if badge %}
<span
  class="badge-chip {% if size == 'xs' %}gap-1 px-1.5 py-px text-[0.6875rem]{% elif size == 'md' %}gap-1.5 px-3 py-1 text-b4{% else %}gap-1 px-2 py-0.5 text-xs{% endif %} {{ class_ }}"
  data-tone="{{ badge.tone }}"
  title="{{ badge.name }}{% if badge.description %} · {{ badge.description }}{% endif %}"
  data-badge-chip
>
  <span class="inline-flex shrink-0" aria-hidden="true">{% lucide badge.icon class="h-3 w-3" %}</span>
  {% if show_name %}<span class="truncate">{{ badge.name }}</span>{% else %}<span class="sr-only">{{ badge.name }}</span>{% endif %}
</span>
{% endif %}
