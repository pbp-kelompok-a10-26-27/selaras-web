{% load lucide %}

<div class="space-y-1.5" data-textarea>
  <div class="relative">
    <textarea name="{{ name }}" id="{{ id }}" rows="{{ rows }}"
      {% if maxlength %}maxlength="{{ maxlength }}"{% endif %}
      {% if required %}required{% endif %}
      {% if disabled %}disabled{% endif %}
      {% if errors %}aria-invalid="true" aria-describedby="{{ id }}-error"{% endif %}
      {% if attrs %}{{ attrs|safe }}{% endif %}
      placeholder=" "
      class="floating-input peer block w-full resize-y rounded-xl border bg-neutral-50 px-4 pb-3 pt-4 font-sans text-sm leading-relaxed text-secondary-900 outline-none transition-all duration-200 focus:border-secondary-600 focus:ring-1 focus:ring-secondary-600 disabled:cursor-not-allowed disabled:opacity-60
        {% if errors %}border-tertiary-600{% else %}border-neutral-400{% endif %}
        {{ class_ }}">{{ value }}</textarea>
    <label
      for="{{ id }}"
      class="floating-label pointer-events-none absolute left-4 top-3.5 z-10 origin-left text-sm text-neutral-700 transition-all duration-200 ease-out"
    >{{ label }}</label>
  </div>

  {% if errors or maxlength %}
  <div class="flex items-start justify-between gap-3 px-1">
    <div id="{{ id }}-error" class="min-w-0 space-y-0.5">
      {% for error in errors %}
      <p role="alert" class="flex items-center gap-1.5 font-sans text-xs font-semibold text-tertiary-700">
        {% lucide "circle-alert" class="w-3.5 h-3.5 shrink-0" %}{{ error }}
      </p>
      {% endfor %}
    </div>
    {% if maxlength %}
    <p data-char-counter="{{ id }}" data-max="{{ maxlength }}" class="ml-auto shrink-0 font-sans text-xs tabular-nums text-neutral-800 transition-colors" aria-live="off">{{ length }}/{{ maxlength }}</p>
    {% endif %}
  </div>
  {% endif %}
</div>
