[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["venv", "node_modules", "staticfiles", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "DJ"]  # style, error, urutan import, aturan Django

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
